<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop - TinyWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans Lao', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
    <div>
        <!-- Navbar -->
        <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center max-w-4xl mx-auto rounded-b-2xl">
            <div class="flex items-center space-x-3">
                <img src="https://via.placeholder.com/150" alt="Logo" class="w-10 h-10 rounded-full object-cover border">
                <span class="font-bold text-lg text-indigo-600">ຊື່ຮ້ານຄ້າຂອງທ່ານ</span>
            </div>
            <div class="text-xs text-slate-500 hidden sm:block">ສິນຄ້າຄຸນນະພາບ ສົ່ງຟຣີທົ່ວປະເທດ</div>
        </header>

        <!-- Main Banner & Content -->
        <main class="max-w-4xl mx-auto p-6 mt-6">
            <div class="rounded-2xl overflow-hidden shadow-lg mb-6 border bg-white">
                <img src="https://via.placeholder.com/800x400" alt="Banner" class="w-full h-48 sm:h-64 object-cover">
            </div>
            <div class="bg-white p-8 rounded-2xl shadow-sm border text-center">
                <span class="px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-bold rounded-full uppercase">Online Store</span>
                <h1 class="text-3xl font-extrabold text-slate-900 mt-3 mb-4">ຍິນດີຕ້ອນຮັບສູ່ຮ້ານຄ້າອອນລາຍ</h1>
                <p class="text-slate-600 text-base mb-6 leading-relaxed">ສັ່ງຊື້ສິນຄ້າ ແລະ ຕິດຕໍ່สอบถามຂໍ້ມູນເພີ່ມເຕີມໄດ້ຜ່ານຊ່ອງທາງດ້ານລຸ່ມນີ້ເລີຍ!</p>
                
                <!-- Contact Buttons -->
                <div class="flex flex-wrap justify-center gap-3">
                    <a href="#" target="_blank" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-sm shadow hover:bg-emerald-500 transition">💬 ສั่งຊື້ຜ່ານ WhatsApp</a>
                    <a href="#" target="_blank" class="px-5 py-2.5 bg-blue-600 text-white font-bold rounded-xl text-sm shadow hover:bg-blue-500 transition">👍 Facebook Page</a>
                    <a href="#" target="_blank" class="px-5 py-2.5 bg-slate-900 text-white font-bold rounded-xl text-sm shadow hover:bg-slate-800 transition">🎵 TikTok Shop</a>
                </div>
            </div>
        </main>
    </div>

    <footer class="text-center py-6 text-slate-400 text-xs">
        &copy; 2026 ຂໍ້ຄວາມທ້າຍເວັບໄຊ. Powered by TinyWeb & Cloudflare.
    </footer>
</body>
</html>
