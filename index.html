<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyWeb - ລະບົບສ້າງເວັບໄຊອັດຕະໂນມັດ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold text-center mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-400">
            TinyWeb AI Builder
        </h1>
        <p class="text-slate-400 text-center mb-6">ສ້າງເວັບໄຊງ່າຍໆ ດ້ວຍ AI ຫຼື ອັບໂຫຼດໄຟລ໌ ພາຍໃນ 1 ນາທີ</p>

        <!-- Form ຕົວຢ່າງ -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">ເລືອກຊື່ Subdomain (ຕົວຢ່າງ: myshop)</label>
                <div class="flex">
                    <input type="text" id="subdomain" placeholder="ຊື່ເວັບຂອງທ່ານ" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-l-lg focus:outline-none focus:border-blue-500 text-white">
                    <span class="bg-slate-700 px-4 py-2 rounded-r-lg border border-l-0 border-slate-700 text-slate-400 flex items-center">.laowebs.com</span>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">ພິມຄຳສັ່ງ (Prompt) ໃຫ້ AI ສ້າງເວັບ</label>
                <textarea rows="3" placeholder="ຕົວຢ່າງ: ສ້າງເວັບໄຊຮ້ານຂາຍກາເຟ ໂທນສີອຸ່ນໆ ມີເມນູ ແລະ ເບີໂທຕິດຕໍ່..." class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-white"></textarea>
            </div>

            <button onclick="alert('ລະບົບກຳລັງເຊື່ອມຕໍ່ Backend ພ້ອມໃຊ້ງານ!')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg">
                🚀 ສ້າງເວັບໄຊເລີຍ
            </button>
        </div>
    </div>

    <footer class="mt-8 text-slate-500 text-sm">
        &copy; 2026 TinyWeb. Powered by LaoWebs & Vercel.
    </footer>

</body>
</html>
