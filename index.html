<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyWeb - ລະບົບສ້າງເວັບໄຊອັດຕະໂນມັດ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-teal-400 to-emerald-400">
                TinyWeb AI
            </h1>
            <p class="text-slate-400 mt-2">ສ້າງເວັບໄຊສ່ວນຕົວໄດ້ງ່າຍໆ ຜ່ານ `.laowebs.com`</p>
        </div>

        <!-- Subdomain Input -->
        <div class="mb-6 bg-slate-800/50 p-4 rounded-xl border border-slate-800">
            <label class="block text-sm font-medium text-slate-300 mb-2">1. ຕັ້ງຊື່ Subdomain ຂອງທ່ານ</label>
            <div class="flex">
                <input type="text" id="subdomain" placeholder="ຕົວຢ່າງ: myshop" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-l-lg focus:outline-none focus:border-blue-500 text-white font-medium">
                <span class="bg-slate-800 px-4 py-2.5 rounded-r-lg border border-l-0 border-slate-700 text-slate-400 flex items-center text-sm font-semibold">.laowebs.com</span>
            </div>
        </div>

        <!-- Tabs Switcher (Main Options) -->
        <div class="flex border-b border-slate-800 mb-6">
            <button onclick="switchTab('ai')" id="btn-ai" class="flex-1 pb-3 font-semibold text-blue-400 border-b-2 border-blue-400 transition">✨ ສ້າງດ້ວຍ AI</button>
            <button onclick="switchTab('upload')" id="btn-upload" class="flex-1 pb-3 font-semibold text-slate-400 hover:text-white transition">📂 ອັບໂຫຼດ / ວາງ Code</button>
            <button onclick="switchTab('template')" id="btn-template" class="flex-1 pb-3 font-semibold text-slate-400 hover:text-white transition">🎨 ເລືອກ Template</button>
        </div>

        <!-- Option 1: AI Prompt -->
        <div id="tab-ai" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">ພິມຄຳສັ່ງ (Prompt) ໃຫ້ AI</label>
                <textarea rows="4" placeholder="ຕົວຢ່າງ: ສ້າງເວັບໄຊແນະນຳຮ້ານຊາບູ ໂທນສີແດງ-ດຳ ມີເມນູອາຫານ..." class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-white text-sm"></textarea>
            </div>
            <button onclick="alert('ກຳລັງສົ່ງຄຳສັ່ງໃຫ້ AI...')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition shadow-lg shadow-blue-600/20">
                🚀 ສ້າງເວັບໄຊດ້ວຍ AI
            </button>
        </div>

        <!-- Option 2: Upload & Paste (รองรับ Single, Multi, Paste) -->
        <div id="tab-upload" class="space-y-4 hidden">
            <!-- Sub-tabs สำหรับ Upload 3 แบบ -->
            <div class="grid grid-cols-3 gap-2 bg-slate-950 p-1.5 rounded-lg border border-slate-800 text-xs font-semibold text-center">
                <button onclick="switchUploadMode('single')" id="sub-single" class="py-2 rounded bg-slate-800 text-white transition">📄 ໄຟລ໌ດຽວ</button>
                <button onclick="switchUploadMode('multi')" id="sub-multi" class="py-2 rounded text-slate-400 hover:text-white transition">📂 ຫຼາຍໄຟລ໌</button>
                <button onclick="switchUploadMode('paste')" id="sub-paste" class="py-2 rounded text-slate-400 hover:text-white transition">📋 ວາງ Code</button>
            </div>

            <!-- Mode A: Single HTML File -->
            <div id="upload-single-box" class="space-y-3">
                <label class="block text-sm font-medium text-slate-300">ອັບໂຫຼດໄຟລ໌ index.html ຂອງທ່ານ</label>
                <input type="file" accept=".html" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-lg text-slate-400 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-teal-600 file:text-white hover:file:bg-teal-500">
            </div>

            <!-- Mode B: Multiple Files -->
            <div id="upload-multi-box" class="space-y-3 hidden">
                <label class="block text-sm font-medium text-slate-300">ອັບໂຫຼດຫຼາຍໄຟລ໌ພ້ອມກັນ (HTML, CSS, JS, ຮູບພາບ)</label>
                <input type="file" multiple class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-lg text-slate-400 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-teal-600 file:text-white hover:file:bg-teal-500">
            </div>

            <!-- Mode C: Paste HTML Code -->
            <div id="upload-paste-box" class="space-y-3 hidden">
                <label class="block text-sm font-medium text-slate-300">ວາງ Source Code HTML ທີ່ນີ້</label>
                <textarea rows="5" placeholder="<!DOCTYPE html>... ວາງ Code ຂອງທ່ານລົງທີ່ນີ້ ..." class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-lg focus:outline-none focus:border-teal-500 text-white text-xs font-mono"></textarea>
            </div>

            <button onclick="alert('ກຳລັງດຳເນີນການ Deploy...')" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-semibold py-3 rounded-lg transition shadow-lg shadow-teal-600/20 mt-2">
                📤 Deploy ຂຶ້ນ Subdomain
            </button>
        </div>

        <!-- Option 3: Template -->
        <div id="tab-template" class="space-y-4 hidden">
            <label class="block text-sm font-medium text-slate-300 mb-2">ເລືອກຮູບແບບເວັບໄຊສຳເລັດຮູບ</label>
            <div class="grid grid-cols-2 gap-3">
                <div class="border border-slate-700 p-3 rounded-lg cursor-pointer hover:border-emerald-500 bg-slate-950">
                    <div class="h-20 bg-slate-800 rounded mb-2 flex items-center justify-center text-xs text-slate-400">Coffee Shop</div>
                    <p class="text-sm font-medium text-center">ຮ້ານກາເຟ</p>
                </div>
                <div class="border border-slate-700 p-3 rounded-lg cursor-pointer hover:border-emerald-500 bg-slate-950">
                    <div class="h-20 bg-slate-800 rounded mb-2 flex items-center justify-center text-xs text-slate-400">Portfolio</div>
                    <p class="text-sm font-medium text-center">ໂປຣໄຟລ໌ສ່ວນຕົວ</p>
                </div>
            </div>
            <button onclick="alert('ສ້າງເວັບຈາກ Template ສຳເລັດ!')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition shadow-lg shadow-emerald-600/20">
                ✨ ສ້າງເວັບຈາກ Template ນີ້
            </button>
        </div>

    </div>

    <footer class="mt-8 text-slate-500 text-xs">
        &copy; 2026 TinyWeb. Powered by LaoWebs & Surge.sh
    </footer>

    <!-- JavaScript logic สำหรับเชื่อมต่อ Backend API -->
    <script>
        function switchTab(tab) {
            document.getElementById('tab-ai').classList.add('hidden');
            document.getElementById('tab-upload').classList.add('hidden');
            document.getElementById('tab-template').classList.add('hidden');

            document.getElementById('btn-ai').className = "flex-1 pb-3 font-semibold text-slate-400 hover:text-white transition border-b-2 border-transparent";
            document.getElementById('btn-upload').className = "flex-1 pb-3 font-semibold text-slate-400 hover:text-white transition border-b-2 border-transparent";
            document.getElementById('btn-template').className = "flex-1 pb-3 font-semibold text-slate-400 hover:text-white transition border-b-2 border-transparent";

            if (tab === 'ai') {
                document.getElementById('tab-ai').classList.remove('hidden');
                document.getElementById('btn-ai').className = "flex-1 pb-3 font-semibold text-blue-400 border-b-2 border-blue-400 transition";
            } else if (tab === 'upload') {
                document.getElementById('tab-upload').classList.remove('hidden');
                document.getElementById('btn-upload').className = "flex-1 pb-3 font-semibold text-teal-400 border-b-2 border-teal-400 transition";
            } else if (tab === 'template') {
                document.getElementById('tab-template').classList.remove('hidden');
                document.getElementById('btn-template').className = "flex-1 pb-3 font-semibold text-emerald-400 border-b-2 border-emerald-400 transition";
            }
        }

        function switchUploadMode(mode) {
            document.getElementById('upload-single-box').classList.add('hidden');
            document.getElementById('upload-multi-box').classList.add('hidden');
            document.getElementById('upload-paste-box').classList.add('hidden');

            document.getElementById('sub-single').className = "py-2 rounded text-slate-400 hover:text-white transition";
            document.getElementById('sub-multi').className = "py-2 rounded text-slate-400 hover:text-white transition";
            document.getElementById('sub-paste').className = "py-2 rounded text-slate-400 hover:text-white transition";

            if (mode === 'single') {
                document.getElementById('upload-single-box').classList.remove('hidden');
                document.getElementById('sub-single').className = "py-2 rounded bg-slate-800 text-white transition";
            } else if (mode === 'multi') {
                document.getElementById('upload-multi-box').classList.remove('hidden');
                document.getElementById('sub-multi').className = "py-2 rounded bg-slate-800 text-white transition";
            } else if (mode === 'paste') {
                document.getElementById('upload-paste-box').classList.remove('hidden');
                document.getElementById('sub-paste').className = "py-2 rounded bg-slate-800 text-white transition";
            }
        }

        // ฟังก์ชันหลักสำหรับส่งข้อมูลไป Deploy
        async function handleDeploy() {
            const subdomain = document.getElementById('subdomain').value.trim();
            const pasteCode = document.getElementById('paste-code-input').value; // สมมติ ID ของ textarea วางโค้ด

            if (!subdomain) {
                alert('กรุณากรอกชื่อ Subdomain ก่อน!');
                return;
            }

            alert('กำลังส่งข้อมูลเพื่อสร้างเว็บไซต์...');

            try {
                const response = await fetch('/api/deploy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        subdomain: subdomain,
                        htmlContent: pasteCode || '<h1>Hello from ' + subdomain + '.laowebs.com</h1>'
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('สำเร็จ! เว็บไซต์ของคุณถูกสร้างแล้วที่: ' + result.url);
                    window.location.href = result.url;
                } else {
                    alert('เกิดข้อผิดพลาด: ' + result.error);
                }
            } catch (err) {
                console.error(err);
                alert('เชื่อมต่อกับ Server ล้มเหลว');
            }
        }
    </script>
</body>
</html>
