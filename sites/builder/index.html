<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyWeb Builder - ສ້າງເວັບໄຊທ໌ງ່າຍໆ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Lao', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-2xl bg-white border border-slate-200 rounded-2xl p-8 shadow-xl">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-indigo-600">TinyWeb Builder</h1>
            <p class="text-slate-500 text-sm mt-1">ສ້າງ ແລະ Deploy หน้าเว็บไซต์ของคุณໄປທີ່ <span class="font-mono text-indigo-500 font-semibold">-tiny.surge.sh</span> ໄດ້ທັນທີ</p>
        </div>

        <div class="space-y-5">
            <!-- ໃສ່ຊື່ Subdomain -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1.5 font-bold">ຊື່ Subdomain</label>
                <div class="flex items-center bg-slate-50 border border-slate-300 rounded-xl overflow-hidden focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
                    <input type="text" id="subdomain" placeholder="ຕົວຢ່າງ: open ຫຼື mysite" class="w-full bg-transparent px-4 py-3.5 text-slate-800 outline-none text-sm">
                    <span class="px-4 text-slate-400 bg-slate-100 border-l border-slate-200 text-sm font-mono py-3.5">-tiny.surge.sh</span>
                </div>
            </div>

            <!-- ໃສ່ HTML Code -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1.5 font-bold">HTML Code ຂອງທ່ານ</label>
                <textarea id="html-code" rows="10" placeholder="<!DOCTYPE html>&#10;<html>&#10;<head><title>My Page</title></head>&#10;<body class='p-6'>&#10;  <h1 class='text-2xl font-bold'>ສະບາຍດີ ໂລກ!</h1>&#10;</body>&#10;</html>" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-4 font-mono text-xs text-emerald-400 outline-none focus:ring-2 focus:ring-indigo-100 transition-all shadow-inner"></textarea>
            </div>

            <!-- ປຸ່ມ Deploy -->
            <button onclick="handleDeploy()" id="deploy-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-600/20 cursor-pointer text-base flex items-center justify-center space-x-2">
                <span>Deploy Website 🚀</span>
            </button>

            <!-- กล่องສະແດງຜົນลัพธ์ -->
            <div id="result-box" class="hidden mt-4 p-4 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm"></div>
        </div>

        <div class="mt-8 text-center text-slate-400 text-xs">
            &copy; 2026 TinyWeb. Powered by Cloudflare Worker & GitHub Actions.
        </div>
    </div>

    <script>
        async function handleDeploy() {
            const subdomain = document.getElementById('subdomain').value.trim().toLowerCase();
            const htmlContent = document.getElementById('html-code').value.trim();
            const btn = document.getElementById('deploy-btn');
            const resultBox = document.getElementById('result-box');

            if (!subdomain || !htmlContent) {
                alert('ກະລຸນາຕື່ມຂໍ້ມູນ Subdomain ແລະ HTML Code ໃຫ້ครบถ้วน!');
                return;
            }

            if (!/^[a-z0-9-]+$/.test(subdomain)) {
                alert('Subdomain ຕ້ອງເປັນພາສາອັງກິດໂຕພິມນ້ອຍ, ຕົວເລກ ຫຼື ເຄື່ອງໝາຍຂີດ (-) เท่านั้น!');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'ກຳລັງ Deploy... ⏳';
            resultBox.classList.add('hidden');

            // ⚡ ປ່ຽນ URL ນີ້ເປັນ Cloudflare Worker URL ຂອງເຈົ້າ (ຕົວຢ່າງ: https://tinyweb-api.yourname.workers.dev)
            const workerUrl = 'https://tinyweb-api.nirankoon.workers.dev'; 

            try {
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        subdomain: subdomain, 
                        htmlContent: htmlContent 
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    resultBox.innerHTML = `✅ <span class="text-emerald-700 font-bold">Deploy ສຳເລັດແລ້ວ!</span><br>
                    <span class="text-slate-600 text-xs">GitHub Actions ກຳລັງສ້າງເວັບໄຊທ໌ (ລໍຖ້າປະມານ 30 ວິນາທີ):</span><br>
                    <a href="${data.url}" target="_blank" class="text-indigo-600 font-semibold underline font-mono mt-1.5 inline-block text-base">${data.url}</a>`;
                    resultBox.classList.remove('hidden');
                } else {
                    throw new Error(data.error || 'ເກີດข้อผิดพลาดในการ Deploy');
                }
            } catch (err) {
                resultBox.innerHTML = `❌ <span class="text-rose-600 font-bold">ເກີດข้อผิดพลาด:</span> <span class="text-rose-700">${err.message}</span>`;
                resultBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Deploy Website 🚀';
            }
        }
    </script>
</body>
</html>
