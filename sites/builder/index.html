<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyWeb Builder (Direct GitHub)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold mb-1 text-cyan-400">TinyWeb Builder</h1>
        <p class="text-slate-400 text-sm mb-6">Deploy custom pages instantly to <span class="text-white font-mono">-tiny.surge.sh</span></p>

        <div class="space-y-4">
            <!-- GitHub Token & Owner Configuration (Optional / Hidden if hardcoded) -->
            <div class="grid grid-cols-2 gap-3 bg-slate-950 p-3 rounded-lg border border-slate-800">
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">GitHub Owner</label>
                    <input type="text" id="gh-owner" value="laowebs" placeholder="username" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">GitHub Token (PAT)</label>
                    <input type="password" id="gh-token" placeholder="ghp_xxxx..." class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white outline-none">
                </div>
            </div>

            <!-- Subdomain Input -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Subdomain Name</label>
                <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg overflow-hidden focus-within:border-cyan-500">
                    <input type="text" id="subdomain" placeholder="open" class="w-full bg-transparent px-4 py-3 text-white outline-none">
                    <span class="px-4 text-slate-500 bg-slate-900 border-l border-slate-800 text-sm font-mono">-tiny.surge.sh</span>
                </div>
            </div>

            <!-- HTML Code Input -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">HTML Code</label>
                <textarea id="html-code" rows="10" placeholder="<!DOCTYPE html>...<html>..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-xs text-green-400 outline-none focus:border-cyan-500"></textarea>
            </div>

            <!-- Submit Button -->
            <button onclick="handleDeployDirect()" id="deploy-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-lg transition-all shadow-lg shadow-cyan-500/20 cursor-pointer">
                Deploy Website 🚀
            </button>

            <!-- Result Box -->
            <div id="result-box" class="hidden mt-4 p-4 bg-slate-950 border border-slate-800 rounded-lg text-sm"></div>
        </div>
    </div>

    <script>
        async function handleDeployDirect() {
            const owner = document.getElementById('gh-owner').value.trim();
            const token = document.getElementById('gh-token').value.trim();
            const subdomain = document.getElementById('subdomain').value.trim().toLowerCase();
            const htmlContent = document.getElementById('html-code').value.trim();
            const btn = document.getElementById('deploy-btn');
            const resultBox = document.getElementById('result-box');

            if (!owner || !token) {
                alert('Please enter your GitHub Owner and Personal Access Token!');
                return;
            }
            if (!subdomain || !htmlContent) {
                alert('Please fill in both subdomain and HTML code!');
                return;
            }

            if (!/^[a-z0-9-]+$/.test(subdomain)) {
                alert('Subdomain can only contain lowercase letters, numbers, and hyphens.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Deploying to GitHub... ⏳';
            resultBox.classList.add('hidden');

            const repo = 'tinyweb';
            const path = `sites/${subdomain}/index.html`;
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            try {
                // 1. Check if file exists to get SHA (for updates)
                let existingSha = null;
                const checkRes = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (checkRes.ok) {
                    const fileData = await checkRes.json();
                    existingSha = fileData.sha;
                }

                // 2. Prepare PUT request payload
                const contentEncoded = btoa(unescape(encodeURIComponent(htmlContent))); // support UTF-8 / Lao text
                const bodyData = {
                    message: `Deploy site for ${subdomain}-tiny.surge.sh via Builder`,
                    content: contentEncoded
                };
                if (existingSha) {
                    bodyData.sha = existingSha;
                }

                // 3. Push file to GitHub Repository
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (!putRes.ok) {
                    const errJson = await putRes.json();
                    throw new Error(errJson.message || 'GitHub API error');
                }

                resultBox.innerHTML = `✅ <span class="text-green-400 font-semibold">Pushed to GitHub Successfully!</span><br>
                <span class="text-slate-400 text-xs">GitHub Actions is now deploying your site...</span><br>
                <a href="https://${subdomain}-tiny.surge.sh" target="_blank" class="text-cyan-400 underline font-mono mt-1 inline-block">https://${subdomain}-tiny.surge.sh</a>`;
                resultBox.classList.remove('hidden');

            } catch (err) {
                resultBox.innerHTML = `❌ <span class="text-red-400 font-semibold">Error:</span> ${err.message}`;
                resultBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Deploy Website 🚀';
            }
        }
    </script>
</body>
</html>
