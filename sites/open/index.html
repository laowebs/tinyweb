<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open-Tiny AI Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6 selection:bg-purple-500 selection:text-white">

    <div class="w-full max-w-xl bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <span class="px-3 py-1 bg-purple-500/10 border border-purple-500/20 text-purple-400 text-xs font-semibold rounded-full uppercase tracking-wider">
                Autonomous Agent
            </span>
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-indigo-400 mt-3">
                Open-Tiny AI Agent
            </h1>
            <p class="text-slate-400 text-sm mt-2">Your lightweight, lightning-fast intelligent assistant powered by <span class="font-mono text-slate-200">open-tiny.surge.sh</span></p>
        </div>

        <!-- Chat / Prompt Box Simulation -->
        <div class="space-y-4">
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 min-h-[140px] flex flex-col justify-between">
                <p class="text-slate-500 text-xs font-mono">// System Ready. Ask Open-Tiny anything...</p>
                <div class="mt-3">
                    <input type="text" id="user-prompt" placeholder="Type a command for Open-Tiny AI..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500 transition-all">
                </div>
            </div>

            <!-- Run Button -->
            <button onclick="runAgent()" id="run-btn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-purple-600/25 cursor-pointer flex items-center justify-center space-x-2">
                <span>🤖 Execute Open-Tiny Agent</span>
            </button>

            <!-- Output Result -->
            <div id="output-box" class="hidden p-4 bg-purple-950/20 border border-purple-800/40 rounded-xl text-sm text-purple-200 font-mono">
                ✨ <span id="output-text">Processing request...</span>
            </div>
        </div>

        <div class="mt-8 text-center text-slate-600 text-xs">
            &copy; 2026 Open-Tiny AI. Deployed seamlessly via TinyWeb.
        </div>
    </div>

    <script>
        function runAgent() {
            const prompt = document.getElementById('user-prompt').value.trim();
            const outputBox = document.getElementById('output-box');
            const outputText = document.getElementById('output-text');

            if (!prompt) {
                alert('Please enter a command or prompt first!');
                return;
            }

            outputBox.classList.remove('hidden');
            outputText.textContent = `Analyzing prompt: "${prompt}"... Agent is online and ready!`;
        }
    </script>
</body>
</html>
